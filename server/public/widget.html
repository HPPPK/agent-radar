<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:12px;font-family:Inter,Segoe UI,Microsoft YaHei,sans-serif;color:var(--ink,#172033);background:var(--bg,#fff)}.head{background:#0f172a;color:white;border-radius:14px;padding:18px}.head h1{margin:3px 0;font-size:22px}.sub{color:#cbd5e1;font-size:12px}.notice{background:#fffbeb;border:1px solid #fde68a;color:#78350f;border-radius:9px;padding:9px;margin:10px 0;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.stat{background:#f1f5f9;border-radius:9px;text-align:center;padding:9px;color:#334155}.stat b{display:block;font-size:20px;color:#2563eb}.section{margin-top:18px}.section h2{font-size:16px;margin:0 0 8px}.card{border:1px solid #e2e8f0;border-radius:10px;padding:11px;margin:8px 0}.plain{background:#eff6ff;border-radius:8px;padding:8px;color:#1e3a5f}.term{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px;margin:6px 0}.muted{font-size:11px;color:#64748b}a{color:#2563eb;text-decoration:none}@media(prefers-color-scheme:dark){body{--ink:#e5e7eb;--bg:#0b1020}.card{border-color:#334155}.plain{background:#172554;color:#dbeafe}.term,.notice{background:#422006;border-color:#854d0e;color:#fde68a}.stat{background:#1e293b;color:#cbd5e1}.muted{color:#94a3b8}}</style></head><body><div id="root"><div class="card">正在读取 Agent Radar 日报……</div></div><script>const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){const d=window.openai&&window.openai.toolOutput&&window.openai.toolOutput.digest;if(!d)return;document.getElementById('root').innerHTML='<div class="head"><div class="sub">AGENT RADAR · '+esc(d.date)+'</div><h1>今天的 Agent + GitHub 技术简报</h1><div class="sub">专业信息保留，同时用大白话解释用途</div></div><div class="notice"><strong>AI 辅助整理：</strong>'+esc(d.content_notice)+'</div><div class="stats"><div class="stat"><b>'+d.agent_updates.length+'</b>Agent</div><div class="stat"><b>'+d.github_items.length+'</b>GitHub</div><div class="stat"><b>'+d.top_github.length+'</b>重点</div><div class="stat"><b>'+d.glossary.length+'</b>术语</div></div><section class="section"><h2>今天只看这 3 件事</h2>'+d.top_agent.map((x,i)=>'<div class="card"><div class="muted">TOP '+(i+1)+' · '+(x.human_reviewed?'已人工复核':'未逐条人工复核')+'</div><b>'+esc(x.title)+'</b><div>'+esc(x.summary)+'</div></div>').join('')+'</section><section class="section"><h2>专业词大白话</h2>'+d.glossary.slice(0,8).map(x=>'<div class="term"><b>'+esc(x.term)+'</b><div>'+esc(x.explanation)+'</div></div>').join('')+'</section><section class="section"><h2>值得看的 Agent 更新</h2>'+d.agent_updates.slice(0,6).map(x=>'<div class="card"><b>'+esc(x.title)+'</b><div class="plain"><strong>大白话：</strong>'+esc(x.plain_explanation)+'</div><div><strong>用途：</strong>'+esc(x.use_case)+'</div><div class="muted">建议：'+esc(x.action)+'</div></div>').join('')+'</section><section class="section"><h2>GitHub 推荐</h2>'+d.top_github.map(x=>'<div class="card"><b>'+esc(x.name)+'</b><div class="plain">'+esc(x.plain_summary)+'</div><div><strong>用途：</strong>'+esc(x.use_case)+'</div><div class="muted">适合：'+esc(x.audience)+'</div></div>').join('')+'</section>';};draw();window.addEventListener('openai:set_globals',draw);</script></body></html>
