<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Radar</title>
<style>
:root{color-scheme:light;--ink:#0f172a;--muted:#64748b;--blue:#2563eb;--line:#e2e8f0;--soft:#f8fafc;--warn:#fffbeb}*{box-sizing:border-box}body{margin:0;background:#eef2ff;color:var(--ink);font-family:Inter,Segoe UI,Microsoft YaHei,sans-serif}.hero{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;padding:54px 20px}.wrap{max-width:1080px;margin:auto}.eyebrow{font-size:12px;letter-spacing:.16em;color:#93c5fd;font-weight:800}.hero h1{font-size:42px;margin:8px 0}.hero p{max-width:760px;color:#dbeafe;font-size:17px}.main{max-width:1080px;margin:-24px auto 50px;padding:0 18px}.panel{background:#fff;border:1px solid rgba(148,163,184,.25);border-radius:18px;padding:24px;box-shadow:0 18px 50px rgba(15,23,42,.1)}.notice{background:var(--warn);border:1px solid #fde68a;border-radius:12px;padding:13px 15px;margin-bottom:18px;color:#78350f}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px;border-radius:12px;background:var(--soft);text-align:center}.stat b{display:block;font-size:28px;color:var(--blue)}h2{margin:30px 0 12px;font-size:21px}.top,.card,.term{border:1px solid var(--line);border-radius:12px;padding:15px;margin:10px 0}.top{border-left:4px solid var(--blue);background:#f8fbff}.plain{background:#eff6ff;border-radius:9px;padding:10px 12px;color:#1e3a5f}.meta{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.term{background:#fffbeb;border-color:#fde68a}.term b{color:#92400e}.project{padding:14px 0;border-bottom:1px solid var(--line)}a{color:var(--blue);text-decoration:none}footer{color:var(--muted);font-size:12px;margin-top:30px;padding-top:16px;border-top:1px solid var(--line)}@media(max-width:760px){.hero h1{font-size:32px}.stats,.grid{grid-template-columns:1fr 1fr}.panel{padding:17px}}
</style></head><body>
<header class="hero"><div class="wrap"><div class="eyebrow">DAILY AGENT INTELLIGENCE</div><h1>Agent Radar</h1><p>把 Agent 技术、GitHub Trending 和专业术语翻译成普通人能看懂、能决定要不要学习或试用的每日简报。</p></div></header>
<main class="main"><section class="panel"><div class="notice"><strong>内容说明：</strong>部分摘要由 AI 辅助整理。来源可达性检查不等于逐条人工事实核验；重要信息请查看原始来源。Agent Radar 是独立开源项目，不代表任何被引用组织的官方意见。</div><div id="status">正在加载最新日报……</div><div id="app" hidden></div><footer><a href="/privacy">隐私政策</a> · <a href="/terms">使用条款</a> · <a href="https://github.com/HPPPK/agent-radar" target="_blank" rel="noreferrer">源代码</a> · 公开工具只读，不要求账号，不收集密码或 API Key。</footer></section></main>
<script>
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(u,t)=>'<a href="'+esc(u)+'" target="_blank" rel="noreferrer">'+esc(t)+'</a>';
function reviewLabel(x){return x.human_reviewed?'已人工复核':'未逐条人工复核'}
function render(d){const app=document.getElementById('app');app.hidden=false;document.getElementById('status').hidden=true;app.innerHTML=
'<div class="meta">'+esc(d.date)+' · '+esc(d.source_policy)+' · '+reviewLabel(d)+'</div><div class="notice"><strong>本期状态：</strong>'+esc(d.content_notice)+'</div>'+
'<div class="stats"><div class="stat"><b>'+d.agent_updates.length+'</b>Agent 动态</div><div class="stat"><b>'+d.github_items.length+'</b>Trending 项目</div><div class="stat"><b>'+d.top_github.length+'</b>重点项目</div><div class="stat"><b>'+d.glossary.length+'</b>术语解释</div></div>'+
'<h2>今天只看这 3 件事</h2>'+d.top_agent.map((x,i)=>'<div class="top"><div class="meta">TOP '+(i+1)+' · '+reviewLabel(x)+'</div><b>'+esc(x.title)+'</b><div>'+esc(x.summary)+'</div>'+link(x.source_url,'查看来源')+'</div>').join('')+
'<h2>专业词，大白话怎么理解</h2><div class="grid">'+d.glossary.map(x=>'<div class="term"><b>'+esc(x.term)+'</b><div>'+esc(x.explanation)+'</div></div>').join('')+'</div>'+
'<h2>Agent 技术变化</h2>'+d.agent_updates.map(x=>'<article class="card"><b>'+esc(x.title)+'</b><div class="meta">'+esc(x.category)+' · '+esc(x.published)+' · '+esc(x.source_type)+' · '+reviewLabel(x)+'</div><p class="plain"><strong>大白话：</strong>'+esc(x.plain_explanation)+'</p><p><strong>能做什么：</strong>'+esc(x.use_case)+'</p><p><strong>为什么值得看：</strong>'+esc(x.why)+'</p><p><strong>术语翻译：</strong>'+esc(x.term_explanation)+'</p><p><strong>建议：</strong>'+esc(x.action)+'</p>'+link(x.source_url,'查看官方来源')+'</article>').join('')+
'<h2>GitHub 最值得看的项目</h2>'+d.top_github.map(x=>'<article class="card"><b>'+link(x.url,x.name)+'</b><p class="plain"><strong>它是什么：</strong>'+esc(x.plain_summary)+'</p><p><strong>用途：</strong>'+esc(x.use_case)+'</p><p><strong>适合：</strong>'+esc(x.audience)+'</p><p class="meta">今天值得看：'+esc(x.reason)+' · '+reviewLabel(x)+'</p></article>').join('')+
'<h2>完整 Trending 列表</h2>'+d.github_items.map((x,i)=>'<div class="project"><b>'+(i+1)+'. '+link(x.url,x.name)+'</b><div class="plain"><strong>大白话：</strong>'+esc(x.plain_summary)+'</div><div><strong>用途：</strong>'+esc(x.use_case)+'</div><div class="meta">适合：'+esc(x.audience)+' · Stars '+esc(x.stars)+' · 今日 +'+esc(x.stars_today)+' · '+reviewLabel(x)+'</div></div>').join('');}
fetch('/api/v1/digests/latest').then(r=>{if(!r.ok)throw new Error('暂无日报');return r.json()}).then(render).catch(e=>{document.getElementById('status').textContent='加载失败：'+e.message});
</script></body></html>
